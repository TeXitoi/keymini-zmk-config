# The STM32F072 only has 16 KB of RAM: shrink buffers so ZMK Studio fits.
# Stack sizes were checked against -fstack-usage call graphs, keep the margins.

# ZMK Studio over USB serial (worst case ~1.55 KB when streaming the keymap)
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=2048
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=128
# USB work queue only runs short transfer callbacks (~370 B)
CONFIG_USB_WORKQUEUE_STACK_SIZE=576
# Only CDC ACM uses async transfers (one read, one write)
CONFIG_USB_MAX_NUM_TRANSFERS=3
# Includes the terminating NUL: names up to 8 characters
CONFIG_ZMK_KEYMAP_LAYER_NAME_MAX_LEN=9

# Behavior buffers, far above what this keymap needs
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=8
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_HELD=4
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_CAPTURED_EVENTS=22
CONFIG_ZMK_BEHAVIOR_STICKY_KEY_MAX_HELD=4

# Only SysTick and USB interrupts (kscan is polled, no GPIO interrupts);
# worst measured ISR chain is ~550 B (~800 B if nested)
CONFIG_ISR_STACK_SIZE=1024
